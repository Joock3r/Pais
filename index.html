<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Israel Lotto Checker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080d1a; font-family: 'Segoe UI', sans-serif; color: #e8eeff; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(100,140,255,0.3); border-radius: 2px; }

    .tab-btn { flex: 1; padding: 9px 0; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; font-size: 12px; transition: all 0.2s; font-family: inherit; background: transparent; color: #4a5a7a; }
    .tab-btn.active { background: rgba(100,140,255,0.18); color: #c3d4ff; box-shadow: 0 0 0 1px rgba(100,140,255,0.3); }

    .num-input { width: 40px; height: 36px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: 700; outline: none; font-family: monospace; border: 1px solid rgba(100,140,255,0.3); background: rgba(100,140,255,0.08); color: #c3d4ff; }
    .strong-input { width: 40px; height: 36px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: 700; outline: none; font-family: monospace; border: 1px solid rgba(212,175,55,0.4); background: rgba(212,175,55,0.08); color: #d4af37; }
    .draw-input { width: 110px; height: 42px; border-radius: 9px; border: 1px solid rgba(100,140,255,0.3); background: rgba(100,140,255,0.08); color: #c3d4ff; text-align: center; font-size: 15px; font-weight: 700; outline: none; font-family: monospace; }

    .check-btn { height: 42px; padding: 0 24px; border-radius: 9px; border: none; font-weight: 700; font-size: 13px; font-family: inherit; transition: all 0.2s; }
    .check-btn:enabled { cursor: pointer; background: linear-gradient(135deg, #4a7fff, #2a50cc); color: white; box-shadow: 0 4px 16px rgba(74,127,255,0.3); }
    .check-btn:disabled { cursor: not-allowed; background: rgba(100,140,255,0.1); color: #4a5a7a; }

    .save-btn { background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.4); color: #d4af37; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; font-family: inherit; }

    .ball { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .ball-normal { background: linear-gradient(135deg, #e8f0ff, #c3d4ff); color: #0d1a4a; box-shadow: 0 2px 8px rgba(100,140,255,0.3); }
    .ball-strong { background: linear-gradient(135deg, #d4af37, #f5e27d); color: #1a1200; box-shadow: 0 2px 8px rgba(212,175,55,0.5); }

    .ticket-row { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; margin-bottom: 7px; }
    .ticket-label { font-size: 10px; color: #7a8ab0; margin-bottom: 7px; font-weight: 600; letter-spacing: 1px; }
    .ticket-inputs { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .divider { width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 2px; }

    .draw-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; }
    .draw-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .draw-num { color: #7a8ab0; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
    .match-badge { background: rgba(212,175,55,0.15); color: #d4af37; font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: 700; border: 1px solid rgba(212,175,55,0.3); }
    .match-ticket { margin-top: 8px; background: rgba(100,140,255,0.05); border-radius: 8px; padding: 8px 12px; border: 1px solid rgba(100,140,255,0.15); }

    .info-box { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: rgba(100,140,255,0.05); border: 1px solid rgba(100,140,255,0.1); font-size: 11px; color: #4a5a7a; }
    .warn-box { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: rgba(212,175,55,0.05); border: 1px solid rgba(212,175,55,0.12); font-size: 11px; color: #7a6030; }
    .error-box { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: rgba(255,80,80,0.07); border: 1px solid rgba(255,80,80,0.2); color: #ff8080; font-size: 13px; }

    .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 22px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const TOTAL_TICKETS = 14;
    const ANTHROPIC_API_KEY = "YOUR_API_KEY_HERE"; // 🔑 Replace with your Anthropic API key

    function makeBlank() {
      return { numbers: ["","","","","",""], strong: "" };
    }

    function Ball({ value, type }) {
      return (
        <div className={`ball ${type === "strong" ? "ball-strong" : "ball-normal"}`}>
          {String(value).padStart(2,"0")}
        </div>
      );
    }

    function TicketEditor({ index, ticket, onChange }) {
      const handleNum = (i, val) => {
        const nums = [...ticket.numbers];
        const p = parseInt(val);
        nums[i] = val === "" ? "" : isNaN(p) ? nums[i] : Math.min(37, Math.max(1, p)).toString().padStart(2,"0");
        onChange({ ...ticket, numbers: nums });
      };
      const handleStrong = (val) => {
        const p = parseInt(val);
        onChange({ ...ticket, strong: val === "" ? "" : isNaN(p) ? ticket.strong : Math.min(7, Math.max(1, p)).toString() });
      };
      return (
        <div className="ticket-row">
          <div className="ticket-label">TICKET {index + 1}</div>
          <div className="ticket-inputs">
            {ticket.numbers.map((n, i) => (
              <input key={i} className="num-input" type="number" min="1" max="37"
                value={n} placeholder="--" onChange={e => handleNum(i, e.target.value)} />
            ))}
            <div className="divider" />
            <input className="strong-input" type="number" min="1" max="7"
              value={ticket.strong} placeholder="★" onChange={e => handleStrong(e.target.value)} />
          </div>
        </div>
      );
    }

    function DrawCard({ draw, tickets }) {
      const winners = tickets.map((t, i) => {
        const matched = t.numbers.filter(n => n && draw.numbers.includes(n));
        const strongMatch = t.strong && t.strong === draw.strong;
        return { index: i, matched, strongMatch };
      }).filter(w => w.matched.length >= 2);

      return (
        <div className="draw-card">
          <div className="draw-header">
            <span className="draw-num">DRAW #{draw.draw_number}</span>
            {winners.length > 0 && (
              <span className="match-badge">{winners.length} MATCH{winners.length > 1 ? "ES" : ""}</span>
            )}
          </div>
          <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:10}}>
            {draw.numbers.map((n,i) => <Ball key={i} value={n} type="normal" />)}
            <Ball value={draw.strong} type="strong" />
          </div>
          {winners.length === 0
            ? <div style={{color:"#4a5a7a", fontSize:12, fontStyle:"italic"}}>No matching tickets (2+ numbers).</div>
            : winners.map(w => (
              <div key={w.index} className="match-ticket">
                <div style={{display:"flex", gap:8, alignItems:"center", flexWrap:"wrap", marginBottom:6}}>
                  <span style={{color:"#c3d4ff", fontSize:12, fontWeight:600}}>Ticket {w.index + 1}:</span>
                  <span style={{color:"#a0b4e8", fontSize:12}}>{w.matched.length} numbers matched</span>
                  {w.strongMatch && <span style={{color:"#d4af37", fontSize:12, fontWeight:700}}>+ Strong ★</span>}
                </div>
                <div style={{display:"flex", gap:5, flexWrap:"wrap"}}>
                  {w.matched.map((n,i) => <Ball key={i} value={n} type="normal" />)}
                  {w.strongMatch && <Ball value={draw.strong} type="strong" />}
                </div>
              </div>
            ))
          }
        </div>
      );
    }

    function App() {
      const [tickets, setTickets] = useState(() => Array.from({length: TOTAL_TICKETS}, makeBlank));
      const [drawRange, setDrawRange] = useState({ start: "", end: "" });
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [tab, setTab] = useState("tickets");
      const [saveMsg, setSaveMsg] = useState("");

      // Load from localStorage on mount
      useEffect(() => {
        try {
          const saved = localStorage.getItem("lotto_tickets");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length === TOTAL_TICKETS) setTickets(parsed);
          }
        } catch(_) {}
      }, []);

      const saveTickets = useCallback(() => {
        try {
          localStorage.setItem("lotto_tickets", JSON.stringify(tickets));
          setSaveMsg("Saved ✓");
          setTimeout(() => setSaveMsg(""), 2000);
        } catch { setSaveMsg("Failed ✗"); }
      }, [tickets]);

      const fetchResults = async () => {
        const start = parseInt(drawRange.start);
        const end = parseInt(drawRange.end);
        if (!start || !end || start > end) { setError("Please enter a valid draw range."); return; }
        if (end - start > 20) { setError("Please limit the range to 20 draws at a time."); return; }
        setLoading(true); setError(""); setResults([]);

        const prompt = `Search paisresults.co.il or mifal-hapayis.co.il for Israeli Lotto draw results from draw number ${start} to ${end}.
For each draw found in that range return the 6 winning numbers (formatted as 2-digit strings, e.g. "03") and the strong number (1–7 as a string).
Respond ONLY with a raw JSON array, no markdown, no explanation, no extra text:
[{"draw_number": ${start}, "numbers": ["03","07","14","22","31","36"], "strong": "4"}, ...]
Skip any draw you cannot find results for.`;

        try {
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": ANTHROPIC_API_KEY,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true"
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 1000,
              tools: [{ type: "web_search_20250305", name: "web_search" }],
              messages: [{ role: "user", content: prompt }]
            })
          });

          if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || `API error ${response.status}`);
          }

          const data = await response.json();
          const text = data.content.filter(b => b.type === "text").map(b => b.text).join("\n");
          const jsonMatch = text.replace(/```json|```/g, "").trim().match(/\[[\s\S]*\]/);
          if (!jsonMatch) throw new Error("Could not parse results. Try again.");
          const parsed = JSON.parse(jsonMatch[0]);
          if (!Array.isArray(parsed) || parsed.length === 0) {
            setError("No draws found for that range. Make sure the draw numbers exist.");
          } else {
            setResults(parsed);
            setTab("results");
          }
        } catch(e) {
          setError("Error: " + e.message);
        }
        setLoading(false);
      };

      const validTickets = tickets.filter(t => t.numbers.every(n => n !== "") && t.strong !== "");

      return (
        <div style={{minHeight:"100vh", background:"linear-gradient(160deg,#080d1a 0%,#0d1530 60%,#070b15 100%)"}}>
          <div style={{maxWidth:740, margin:"0 auto", padding:"0 14px 40px"}}>

            {/* Header */}
            <div style={{textAlign:"center", padding:"32px 0 24px"}}>
              <div style={{fontSize:10, letterSpacing:4, color:"#d4af37", marginBottom:8, fontWeight:600}}>מפעל הפייס · MIFAL HAPAYIS</div>
              <h1 style={{fontSize:36, fontWeight:800, background:"linear-gradient(135deg,#c3d4ff,#7a9fff,#d4af37)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent"}}>
                🎱 Lotto Checker
              </h1>
              <p style={{color:"#4a5a7a", fontSize:13, marginTop:6}}>Save your tickets · Check any draw range · AI-powered results</p>
            </div>

            {/* Tabs */}
            <div style={{display:"flex", gap:6, marginBottom:20, background:"rgba(255,255,255,0.04)", borderRadius:10, padding:4}}>
              {[["tickets","🎟 My Tickets"],["check","🔍 Check Draws"],["results",`🏆 Results${results.length ? ` (${results.length})` : ""}`]].map(([key,label]) => (
                <button key={key} className={`tab-btn${tab===key?" active":""}`} onClick={() => setTab(key)}>{label}</button>
              ))}
            </div>

            {/* TICKETS */}
            {tab === "tickets" && (
              <div>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
                  <span style={{color:"#7a8ab0", fontSize:12}}>
                    <span style={{fontFamily:"monospace"}}>{validTickets.length}/{TOTAL_TICKETS}</span> tickets complete
                  </span>
                  <button className="save-btn" onClick={saveTickets}>{saveMsg || "💾 Save Tickets"}</button>
                </div>
                {tickets.map((t, i) => (
                  <TicketEditor key={i} index={i} ticket={t} onChange={updated => {
                    const next = [...tickets]; next[i] = updated; setTickets(next);
                  }} />
                ))}
                <div className="info-box">
                  6 numbers (1–37) per ticket · Strong number in the gold field (1–7) · Tickets are saved in your browser's localStorage.
                </div>
              </div>
            )}

            {/* CHECK */}
            {tab === "check" && (
              <div className="panel">
                <h2 style={{fontSize:16, fontWeight:700, marginBottom:18, color:"#c3d4ff"}}>Enter Draw Range</h2>
                <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end"}}>
                  {[["start","FROM DRAW #","3405"],["end","TO DRAW #","3415"]].map(([key,label,ph]) => (
                    <div key={key}>
                      <label style={{display:"block", fontSize:10, color:"#7a8ab0", marginBottom:5, letterSpacing:1, fontWeight:600}}>{label}</label>
                      <input className="draw-input" type="number" value={drawRange[key]} placeholder={ph}
                        onChange={e => setDrawRange(p => ({...p, [key]: e.target.value}))} />
                    </div>
                  ))}
                  <button className="check-btn" onClick={fetchResults} disabled={loading}>
                    {loading ? "⏳ Searching..." : "🔍 Check Now"}
                  </button>
                </div>
                {error && <div className="error-box">{error}</div>}
                {loading && (
                  <div style={{marginTop:18, textAlign:"center", color:"#4a5a7a", fontSize:13}}>
                    Fetching draw results via AI web search…
                    <br/><span style={{fontSize:11}}>This may take a few seconds</span>
                  </div>
                )}
                <div className="warn-box">
                  ℹ Results are fetched live using the Anthropic AI API with web search.
                  Max 20 draws per query.
                  {validTickets.length < TOTAL_TICKETS && (
                    <span style={{color:"#cc6040"}}> ⚠ {TOTAL_TICKETS - validTickets.length} tickets are incomplete.</span>
                  )}
                </div>
              </div>
            )}

            {/* RESULTS */}
            {tab === "results" && (
              <div>
                {results.length === 0
                  ? <div style={{textAlign:"center", padding:"50px 20px", color:"#4a5a7a"}}>
                      <div style={{fontSize:40, marginBottom:12}}>🎱</div>
                      <div style={{fontSize:15, fontWeight:600, color:"#7a8ab0", marginBottom:6}}>No results yet</div>
                      <div style={{fontSize:12}}>Go to the Check tab to search for draws</div>
                    </div>
                  : <>
                      <div style={{color:"#7a8ab0", fontSize:12, marginBottom:14}}>
                        Found <span style={{fontFamily:"monospace"}}>{results.length}</span> draws ·
                        checking against <span style={{fontFamily:"monospace"}}>{validTickets.length}</span> complete tickets
                      </div>
                      {[...results].sort((a,b) => b.draw_number - a.draw_number).map(draw => (
                        <DrawCard key={draw.draw_number} draw={draw} tickets={validTickets} />
                      ))}
                    </>
                }
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
