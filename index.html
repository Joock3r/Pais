
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בודק לוטו</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    :root {
      --bg: #080d1a;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-strong: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.09);
      --blue: #4a7fff;
      --blue-soft: #c3d4ff;
      --muted: #7a8ab0;
      --gold: #d4af37;
      --green: #62d58b;
      --red: #ff7070;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: radial-gradient(circle at 15% 10%, #17244b 0, transparent 32%), linear-gradient(155deg, #080d1a 0%, #0d1530 58%, #070b15 100%);
      color: #e8eeff;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .app { width: min(780px, 100%); min-height: 100vh; margin: 0 auto; padding: 24px 14px 48px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: clamp(92px, 19vw, 124px); height: auto; display: block; object-fit: contain; filter: drop-shadow(0 8px 18px rgba(74,127,255,.22)); }
    h1 { margin: 0; font-size: 23px; letter-spacing: 0; }
    .sub { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .status { color: var(--green); font-size: 12px; font-weight: 700; }
    .tabs { display: flex; gap: 5px; padding: 4px; margin-bottom: 18px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .tab { flex: 1; min-height: 40px; border: 0; border-radius: 6px; background: transparent; color: #56678f; cursor: pointer; font-size: 12px; font-weight: 800; }
    .tab.active { color: var(--blue-soft); background: rgba(100,140,255,.16); box-shadow: inset 0 0 0 1px rgba(100,140,255,.24); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar-actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .button { min-height: 38px; padding: 0 14px; border-radius: 7px; border: 1px solid rgba(100,140,255,.35); background: rgba(100,140,255,.14); color: var(--blue-soft); font-size: 12px; font-weight: 800; cursor: pointer; }
    .button.primary { border: 0; background: linear-gradient(135deg, #4a7fff, #274fc9); color: #fff; box-shadow: 0 7px 18px rgba(74,127,255,.26); }
    .button.gold { color: #f3d467; border-color: rgba(212,175,55,.35); background: rgba(212,175,55,.11); }
    .button.danger { color: var(--red); border-color: rgba(255,112,112,.25); background: rgba(255,112,112,.08); }
    .button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .panel, .ticket, .draw-card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .panel { padding: 20px; }
    .ticket { padding: 14px; margin-bottom: 9px; }
    .ticket.double { border-color: rgba(255,160,0,.35); background: rgba(255,160,0,.04); }
    .ticket-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .ticket-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--blue-soft); }
    .counter { color: var(--muted); font: 700 11px Consolas, monospace; }
    .double-toggle { border: 1px solid rgba(255,160,0,.25); border-radius: 5px; background: transparent; color: #806739; padding: 3px 9px; cursor: pointer; font-size: 11px; font-weight: 800; }
    .double-toggle.on { color: #ffb52e; background: rgba(255,160,0,.16); border-color: rgba(255,160,0,.5); }
    .number-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(34px, 1fr)); gap: 5px; margin-bottom: 12px; direction: rtl; }
    .ball-button, .ball { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 800 11px Consolas, monospace; }
    .ball-button { justify-self: center; border: 0; cursor: pointer; background: rgba(255,255,255,.065); color: #64769d; transition: transform .12s, background .12s; }
    .ball-button.selected { color: #fff; background: linear-gradient(135deg, #4a7fff, #1a40cc); box-shadow: 0 0 12px rgba(74,127,255,.52); transform: scale(1.08); }
    .ball-button.strong.selected { color: #1a1200; background: linear-gradient(135deg, #d4af37, #f5e27d); box-shadow: 0 0 12px rgba(212,175,55,.5); }
    .ball-button:disabled { opacity: .22; cursor: not-allowed; }
    .strong-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; direction: rtl; }
    .strong-label { color: var(--gold); font-size: 10px; font-weight: 800; margin-left: 4px; direction: rtl; }
    .section-title { margin: 0 0 5px; color: var(--blue-soft); font-size: 16px; }
    .section-copy { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
    .range { display: grid; grid-template-columns: 1fr 1fr auto; gap: 9px; align-items: end; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .field input { width: 100%; height: 43px; border-radius: 7px; border: 1px solid rgba(100,140,255,.3); background: rgba(100,140,255,.07); color: var(--blue-soft); padding: 0 11px; direction: ltr; text-align: center; font: 800 15px Consolas, monospace; }
    .api-settings { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
    .api-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .api-row input { text-align: left; font-size: 11px; }
    .message { margin-top: 13px; padding: 11px 13px; border-radius: 7px; font-size: 12px; border: 1px solid rgba(100,140,255,.2); color: var(--blue-soft); background: rgba(100,140,255,.07); }
    .message.error { color: #ff9b9b; border-color: rgba(255,112,112,.25); background: rgba(255,112,112,.07); }
    .progress { height: 3px; margin-top: 14px; overflow: hidden; border-radius: 3px; background: rgba(255,255,255,.07); }
    .progress::after { content: ""; display: block; width: 38%; height: 100%; background: var(--blue); animation: loading 1s ease-in-out infinite alternate; }
    @keyframes loading { from { transform: translateX(165%); } to { transform: translateX(-165%); } }
    .summary { margin-bottom: 12px; color: var(--muted); font-size: 12px; }
    .draw-card { padding: 16px; margin-bottom: 10px; }
    .draw-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .draw-number { font-size: 13px; font-weight: 900; color: var(--blue-soft); }
    .source { color: var(--muted); font-size: 10px; text-decoration: none; }
    .winning-balls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; direction: rtl; }
    .ball { color: #10204e; background: linear-gradient(135deg, #edf3ff, #bcd0ff); box-shadow: 0 3px 9px rgba(100,140,255,.25); }
    .ball.strong { color: #1a1200; background: linear-gradient(135deg, #d4af37, #f5e27d); }
    .separator { width: 1px; height: 24px; background: var(--border); }
    .matches { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    .match { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; background: rgba(100,140,255,.055); margin-top: 6px; font-size: 12px; }
    .win { color: var(--green); font-weight: 900; }
    .no-win { color: #56678f; font-size: 12px; }
    .empty { text-align: center; padding: 52px 18px; color: var(--muted); }
    .hidden-input { display: none; }
    @media (max-width: 560px) {
      .app { padding-top: 16px; }
      .header { align-items: flex-start; }
      .status { display: none; }
      .range { grid-template-columns: 1fr 1fr; }
      .range .button { grid-column: 1 / -1; }
      .panel { padding: 15px; }
      .api-row { grid-template-columns: 1fr; }
      .tab { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;
    const TICKETS_KEY = "lotto_checker_tickets_v2";
    const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbz4VsyUfvdPJnzcl6gUuVQfIgsYkLyCq7WQjpt9BTzSWWX5ZY_trcD6NnBdsN_Cl_A/exec";
    const MAX_RANGE = 50;

    function blankTicket() {
      return { numbers: [], strong: null, double: false };
    }

    function normalizeTicket(ticket) {
      const numbers = [...new Set((ticket.numbers || []).map(Number).filter(number => number >= 1 && number <= 37))].slice(0, 6).sort((a, b) => a - b);
      const strong = Number(ticket.strong);
      return { numbers, strong: strong >= 1 && strong <= 7 ? strong : null, double: Boolean(ticket.double) };
    }

    function Ball({ value, strong = false }) {
      return <div className={`ball${strong ? " strong" : ""}`}>{String(value).padStart(2, "0")}</div>;
    }

    function TicketEditor({ ticket, index, total, onChange, onRemove }) {
      const selected = new Set(ticket.numbers);
      const toggleNumber = number => {
        const next = new Set(selected);
        if (next.has(number)) next.delete(number);
        else if (next.size < 6) next.add(number);
        onChange({ ...ticket, numbers: [...next].sort((a, b) => a - b) });
      };

      return (
        <article className={`ticket${ticket.double ? " double" : ""}`}>
          <div className="ticket-head">
            <div className="ticket-title">
              <span>טופס {index + 1}</span>
              <span className="counter">{selected.size}/6 {ticket.strong ? "★" : ""}</span>
              <button className={`double-toggle${ticket.double ? " on" : ""}`} onClick={() => onChange({ ...ticket, double: !ticket.double })}>דאבל</button>
            </div>
            {total > 1 && <button className="button danger" onClick={onRemove} aria-label={`מחיקת טופס ${index + 1}`}>מחיקה</button>}
          </div>
          <div className="number-grid">
            {Array.from({ length: 37 }, (_, position) => position + 1).map(number => (
              <button key={number} className={`ball-button${selected.has(number) ? " selected" : ""}`} disabled={!selected.has(number) && selected.size === 6} onClick={() => toggleNumber(number)}>
                {String(number).padStart(2, "0")}
              </button>
            ))}
          </div>
          <div className="strong-row">
            <span className="strong-label">מספר חזק</span>
            {Array.from({ length: 7 }, (_, position) => position + 1).map(number => (
              <button key={number} className={`ball-button strong${ticket.strong === number ? " selected" : ""}`} onClick={() => onChange({ ...ticket, strong: ticket.strong === number ? null : number })}>{number}</button>
            ))}
          </div>
        </article>
      );
    }

    function DrawCard({ draw, tickets }) {
      const matches = tickets.map((ticket, index) => {
        const regular = ticket.numbers.filter(number => draw.numbers.includes(String(number).padStart(2, "0"))).length;
        const strong = String(ticket.strong) === String(draw.strong);
        return { index, regular, strong, double: ticket.double };
      });
      const winners = matches.filter(match => match.regular >= 3);

      return (
        <article className="draw-card">
          <div className="draw-head">
            <span className="draw-number">הגרלה #{draw.draw_number}</span>
            <a className="source" href={draw.source_url} target="_blank" rel="noreferrer">מקור: מפעל הפיס</a>
          </div>
          <div className="winning-balls">
            {draw.numbers.map(number => <Ball key={number} value={number} />)}
            <span className="separator" />
            <Ball value={draw.strong} strong />
          </div>
          <div className="matches">
            {winners.length === 0 ? <div className="no-win">אין טפסים עם 3 מספרים תואמים ומעלה.</div> : winners.map(match => (
              <div className="match" key={match.index}>
                <span>טופס {match.index + 1}{match.double ? " · דאבל" : ""}</span>
                <span className="win">{match.regular}/6{match.strong ? " + חזק ★" : ""}</span>
              </div>
            ))}
          </div>
        </article>
      );
    }

    function App() {
      const [tickets, setTickets] = useState([blankTicket()]);
      const [tab, setTab] = useState("tickets");
      const [fromDraw, setFromDraw] = useState(3944);
      const [toDraw, setToDraw] = useState(3944);
      const [results, setResults] = useState([]);
      const [fetchErrors, setFetchErrors] = useState([]);
      const [message, setMessage] = useState("");
      const [loading, setLoading] = useState(false);
      const [saved, setSaved] = useState("");
      const importRef = useRef(null);

      useEffect(() => {
        try {
          const storedTickets = JSON.parse(localStorage.getItem(TICKETS_KEY));
          if (Array.isArray(storedTickets) && storedTickets.length) setTickets(storedTickets.map(normalizeTicket));
        } catch (_) {}
      }, []);

      const validTickets = tickets.filter(ticket => ticket.numbers.length === 6 && ticket.strong);
      const updateTicket = (index, updated) => setTickets(current => current.map((ticket, position) => position === index ? normalizeTicket(updated) : ticket));
      const saveTickets = () => {
        localStorage.setItem(TICKETS_KEY, JSON.stringify(tickets));
        setSaved("נשמר ✓");
        setTimeout(() => setSaved(""), 1800);
      };
      const exportTickets = () => {
        const blob = new Blob([JSON.stringify(tickets, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `lotto-tickets-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
      };
      const importTickets = event => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!Array.isArray(parsed) || !parsed.length) throw new Error();
            const imported = parsed.map(normalizeTicket);
            setTickets(imported);
            localStorage.setItem(TICKETS_KEY, JSON.stringify(imported));
            setSaved(`יובאו ${imported.length} טפסים ✓`);
          } catch (_) {
            setSaved("קובץ לא תקין");
          }
        };
        reader.readAsText(file);
        event.target.value = "";
      };

      const checkRange = async () => {
        setMessage("");
        setFetchErrors([]);
        const first = Number(fromDraw);
        const last = Number(toDraw);
        if (!Number.isInteger(first) || !Number.isInteger(last) || first < 1 || last < 1) {
          setMessage("יש להזין שני מספרי הגרלה תקינים.");
          return;
        }
        if (Math.abs(last - first) + 1 > MAX_RANGE) {
          setMessage(`ניתן לבדוק עד ${MAX_RANGE} הגרלות בכל פעם.`);
          return;
        }
        if (!validTickets.length) {
          setMessage("יש להשלים לפחות טופס אחד לפני הבדיקה.");
          return;
        }

        setLoading(true);
        try {
          const url = new URL(DEFAULT_API_URL);
          url.searchParams.set("from", String(Math.min(first, last)));
          url.searchParams.set("to", String(Math.max(first, last)));
          const response = await fetch(url.toString(), { redirect: "follow" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          if (!payload.ok && !(payload.draws || []).length) throw new Error(payload.error || "לא התקבלו תוצאות.");
          setResults((payload.draws || []).sort((a, b) => b.draw_number - a.draw_number));
          setFetchErrors(payload.errors || []);
          setTab("results");
        } catch (error) {
          setMessage(`הבדיקה נכשלה: ${error.message}`);
        } finally {
          setLoading(false);
        }
      };

      return (
        <main className="app">
          <header className="header">
            <div className="brand">
              <img className="brand-mark" src="https://www.pais.co.il/images/Lotto-sml_1.png" alt="לוטו - מפעל הפיס" />
              <div><h1>בודק לוטו</h1><p className="sub">טפסים שמורים ובדיקת טווח הגרלות</p></div>
            </div>
            <span className="status">{validTickets.length}/{tickets.length} טפסים מלאים</span>
          </header>

          <nav className="tabs" aria-label="ניווט ראשי">
            <button className={`tab${tab === "tickets" ? " active" : ""}`} onClick={() => setTab("tickets")}>הטפסים שלי</button>
            <button className={`tab${tab === "check" ? " active" : ""}`} onClick={() => setTab("check")}>בדיקה אוטומטית</button>
            <button className={`tab${tab === "results" ? " active" : ""}`} onClick={() => setTab("results")}>תוצאות {results.length ? `(${results.length})` : ""}</button>
          </nav>

          {tab === "tickets" && <section>
            <div className="toolbar">
              <span className="summary">בחר 6 מספרים ומספר חזק לכל טופס</span>
              <div className="toolbar-actions">
                <button className="button gold" onClick={saveTickets}>{saved || "שמור"}</button>
                <button className="button" onClick={exportTickets}>ייצוא</button>
                <button className="button" onClick={() => importRef.current.click()}>ייבוא</button>
                <button className="button primary" onClick={() => setTickets(current => [...current, blankTicket()])}>הוסף טופס</button>
                <input ref={importRef} className="hidden-input" type="file" accept="application/json,.json" onChange={importTickets} />
              </div>
            </div>
            {tickets.map((ticket, index) => <TicketEditor key={index} ticket={ticket} index={index} total={tickets.length} onChange={updated => updateTicket(index, updated)} onRemove={() => setTickets(current => current.filter((_, position) => position !== index))} />)}
          </section>}

          {tab === "check" && <section className="panel">
            <h2 className="section-title">בדיקת טווח הגרלות</h2>
            <p className="section-copy">התוצאות נטענות מאתר מפעל הפיס ונבדקות מול כל הטפסים המלאים.</p>
            <div className="range">
              <div className="field"><label htmlFor="fromDraw">מהגרלה</label><input id="fromDraw" type="number" min="1" value={fromDraw} onChange={event => setFromDraw(event.target.value)} /></div>
              <div className="field"><label htmlFor="toDraw">עד הגרלה</label><input id="toDraw" type="number" min="1" value={toDraw} onChange={event => setToDraw(event.target.value)} /></div>
              <button className="button primary" disabled={loading} onClick={checkRange}>{loading ? "טוען..." : "בדוק הכל"}</button>
            </div>
            {loading && <div className="progress" />}
            {message && <div className={`message${message.includes("נכשלה") || message.includes("תקינה") || message.includes("יש ") ? " error" : ""}`}>{message}</div>}
          </section>}

          {tab === "results" && <section>
            {results.length === 0 ? <div className="empty">אין תוצאות עדיין.</div> : <>
              <div className="summary">{results.length} הגרלות נבדקו מול {validTickets.length} טפסים מלאים</div>
              {fetchErrors.length > 0 && <div className="message error">{fetchErrors.length} הגרלות לא נטענו: {fetchErrors.map(item => item.draw_number).join(", ")}</div>}
              {results.map(draw => <DrawCard key={draw.draw_number} draw={draw} tickets={validTickets} />)}
            </>}
          </section>}
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
