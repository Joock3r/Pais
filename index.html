<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎱 Lotto Checker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080d1a; font-family: 'Segoe UI', sans-serif; color: #e8eeff; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(100,140,255,0.3); border-radius: 2px; }

    .tab-btn {
      flex: 1; padding: 9px 4px; border-radius: 8px; border: none; cursor: pointer;
      font-weight: 700; font-size: 12px; transition: all 0.2s; font-family: inherit;
      background: transparent; color: #4a5a7a;
    }
    .tab-btn.active { background: rgba(100,140,255,0.18); color: #c3d4ff; box-shadow: 0 0 0 1px rgba(100,140,255,0.3); }

    .num-input {
      width: 40px; height: 36px; border-radius: 8px; text-align: center; font-size: 13px;
      font-weight: 700; outline: none; font-family: monospace;
      border: 1px solid rgba(100,140,255,0.3); background: rgba(100,140,255,0.08); color: #c3d4ff;
    }
    .strong-input {
      width: 40px; height: 36px; border-radius: 8px; text-align: center; font-size: 13px;
      font-weight: 700; outline: none; font-family: monospace;
      border: 1px solid rgba(212,175,55,0.4); background: rgba(212,175,55,0.08); color: #d4af37;
    }
    .draw-input {
      width: 110px; height: 42px; border-radius: 9px;
      border: 1px solid rgba(100,140,255,0.3); background: rgba(100,140,255,0.08);
      color: #c3d4ff; text-align: center; font-size: 15px; font-weight: 700; outline: none; font-family: monospace;
    }
    .check-btn {
      height: 42px; padding: 0 24px; border-radius: 9px; border: none;
      font-weight: 700; font-size: 13px; font-family: inherit; transition: all 0.2s;
      cursor: pointer; background: linear-gradient(135deg, #4a7fff, #2a50cc);
      color: white; box-shadow: 0 4px 16px rgba(74,127,255,0.3);
    }
    .save-btn {
      background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.4);
      color: #d4af37; padding: 7px 16px; border-radius: 8px; cursor: pointer;
      font-weight: 700; font-size: 12px; font-family: inherit;
    }
    .ball {
      width: 34px; height: 34px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .ball-normal { background: linear-gradient(135deg, #e8f0ff, #c3d4ff); color: #0d1a4a; box-shadow: 0 2px 8px rgba(100,140,255,0.3); }
    .ball-strong { background: linear-gradient(135deg, #d4af37, #f5e27d); color: #1a1200; box-shadow: 0 2px 8px rgba(212,175,55,0.5); }

    .ticket-row { border-radius: 10px; padding: 10px 12px; margin-bottom: 7px; transition: border 0.2s; }
    .ticket-row.normal { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
    .ticket-row.double { background: rgba(255,160,0,0.04); border: 1px solid rgba(255,160,0,0.35); }

    .ticket-label { font-size: 10px; color: #7a8ab0; font-weight: 600; letter-spacing: 1px; }
    .ticket-inputs { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .divider { width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 2px; flex-shrink: 0; }

    .double-badge {
      padding: 2px 8px; border-radius: 5px; font-weight: 700; font-size: 11px;
      font-family: inherit; cursor: pointer; border: none; transition: all 0.2s;
    }
    .double-badge.off { background: rgba(255,255,255,0.06); color: #4a5a7a; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
    .double-badge.on  { background: rgba(255,160,0,0.25); color: #ffaa00; box-shadow: 0 0 0 1px rgba(255,160,0,0.5); }

    .scan-btn {
      padding: 2px 8px; border-radius: 5px; font-weight: 700; font-size: 11px;
      font-family: inherit; cursor: pointer; border: none; transition: all 0.2s;
      background: rgba(100,200,100,0.1); color: #70d070; box-shadow: 0 0 0 1px rgba(100,200,100,0.25);
    }
    .scan-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .remove-btn {
      background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.25);
      color: #ff7070; border-radius: 6px; width: 22px; height: 22px; cursor: pointer;
      font-size: 13px; display: flex; align-items: center; justify-content: center; font-family: inherit;
    }

    .draw-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; }
    .match-badge { background: rgba(212,175,55,0.15); color: #d4af37; font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: 700; border: 1px solid rgba(212,175,55,0.3); }
    .match-ticket { margin-top: 8px; background: rgba(100,140,255,0.05); border-radius: 8px; padding: 8px 12px; border: 1px solid rgba(100,140,255,0.15); }

    .info-box  { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: rgba(100,140,255,0.05); border: 1px solid rgba(100,140,255,0.1); font-size: 11px; color: #4a5a7a; }
    .warn-box  { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: rgba(212,175,55,0.05); border: 1px solid rgba(212,175,55,0.12); font-size: 11px; color: #7a6030; }
    .error-box { margin-top: 12px; padding: 10px 14px; border-radius: 8px; background: rgba(255,80,80,0.07); border: 1px solid rgba(255,80,80,0.2); color: #ff8080; font-size: 13px; }
    .panel     { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 22px; }

    textarea {
      width: 100%; min-height: 130px; border-radius: 10px; padding: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(100,140,255,0.2);
      color: #c3d4ff; font-size: 13px; font-family: monospace; resize: vertical; outline: none;
      direction: ltr;
    }
    textarea::placeholder { color: #3a4a6a; }

    @keyframes pulse-red { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(1.4); } }
    .live-dot { width:8px; height:8px; border-radius:50%; background:#ff3333; display:inline-block; animation: pulse-red 1.2s ease-in-out infinite; }

    .num-ball-grid {
      width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
      font-weight:700; font-size:12px; font-family:monospace; transition: all 0.15s;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .num-ball-grid.off { background:rgba(255,255,255,0.06); color:#4a5a7a; }
    .num-ball-grid.on  { background:linear-gradient(135deg,#4a7fff,#1a40cc); color:white; box-shadow:0 0 14px rgba(74,127,255,0.7); transform:scale(1.12); }
    .num-ball-grid.strong-off { background:rgba(255,255,255,0.06); color:#4a5a7a; }
    .num-ball-grid.strong-on  { background:linear-gradient(135deg,#d4af37,#f5e27d); color:#1a1200; box-shadow:0 0 14px rgba(212,175,55,0.7); transform:scale(1.12); }

    .live-ticket {
      border-radius:12px; padding:12px 14px; margin-bottom:8px; transition: all 0.25s;
    }
    .live-ticket.none   { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); }
    .live-ticket.low    { background:rgba(100,140,255,0.04); border:1px solid rgba(100,140,255,0.2); }
    .live-ticket.medium { background:rgba(74,200,100,0.05); border:1px solid rgba(74,200,100,0.3); }
    .live-ticket.high   { background:rgba(74,127,255,0.08); border:1px solid rgba(74,127,255,0.5); box-shadow:0 0 16px rgba(74,127,255,0.15); }
    .live-ticket.jackpot{ background:rgba(212,175,55,0.08); border:1px solid rgba(212,175,55,0.6); box-shadow:0 0 20px rgba(212,175,55,0.2); }

    @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)} }
    .ball-hit { animation: pop 0.3s ease-out; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useCallback, useRef } = React;

  /* ─────────────── helpers ─────────────── */
  function makeBlank() {
    return { numbers: ["","","","","",""], strong: "", double: false };
  }

  // Parse pasted lottery result text — tries multiple strategies
  function parsePastedResults(raw) {
    const results = [];

    // ── Strategy 1: pais.co.il archive format ──
    // Each draw block looks like:
    //   מספר הגרלה\n3952\n ... המספר החזק:\n4\nהמספרים שעלו בגורל:\n   1. 1\n   2. 9\n ...
    const blockRe = /מספר\s+הגרלה\s*\n\s*(\d{3,5})\s*\n[\s\S]{0,400}?המספר\s+החזק:\s*\n\s*(\d)\s*\nהמספרים\s+שעלו\s+בגורל:\s*\n((?:\s*\d+\.\s+\d+\s*\n?){6})/g;
    for (const m of raw.matchAll(blockRe)) {
      const drawNum = parseInt(m[1]);
      const strong  = m[2];
      const nums    = (m[3].match(/\d+\.\s+(\d+)/g) || [])
        .map(s => s.replace(/\d+\.\s+/, "").trim().padStart(2,"0"));
      if (nums.length === 6) {
        results.push({ draw_number: drawNum, numbers: nums, strong });
      }
    }
    if (results.length) return results;

    // ── Strategy 2: looser Hebrew format — any "מספר X ... חזק: Y ... המספרים: a,b,c..." ──
    const heRe = /מספר\s+(\d{3,5})[\s\S]{0,600}?(?:המספר\s+החזק)[^:\d]*[:\s]*(\d)[\s\S]{0,400}?(?:המספרים\s+שעלו[^:]*|עלו\s+המספרים)[^:\d]*[:\s]+((?:\d{1,2}[\s,.\n]+){5}\d{1,2})/gi;
    for (const m of raw.matchAll(heRe)) {
      const nums = (m[3].match(/\d{1,2}/g) || []).map(n => n.padStart(2,"0"));
      if (nums.length === 6) {
        results.push({ draw_number: parseInt(m[1]), numbers: nums, strong: m[2] });
      }
    }
    if (results.length) return results;

    // ── Strategy 3: plain lines — 7 numbers (6 regular + strong) or 8 (draw# + 6 + strong) ──
    for (const line of raw.split(/\n+/)) {
      const ns = (line.match(/\d+/g) || []).map(Number);
      if (ns.length === 7) {
        const [a,b,c,d,e,f,s] = ns;
        const reg = [a,b,c,d,e,f];
        if (reg.every(n => n>=1 && n<=37) && s>=1 && s<=7)
          results.push({ draw_number: `#${results.length+1}`, numbers: reg.map(n=>n.toString().padStart(2,"0")), strong: s.toString() });
      } else if (ns.length === 8) {
        const [draw,a,b,c,d,e,f,s] = ns;
        const reg = [a,b,c,d,e,f];
        if (draw>100 && reg.every(n=>n>=1&&n<=37) && s>=1&&s<=7)
          results.push({ draw_number: draw, numbers: reg.map(n=>n.toString().padStart(2,"0")), strong: s.toString() });
      }
    }
    if (results.length) return results;

    // ── Strategy 4: last resort — scrape 6 valid numbers + a strong from full text ──
    const all = (raw.match(/\b\d{1,2}\b/g)||[]).map(Number);
    const reg = [...new Set(all.filter(n=>n>=1&&n<=37))].slice(0,6);
    const s   = all.find(n=>n>=1&&n<=7);
    if (reg.length===6 && s) {
      results.push({ draw_number: "manual", numbers: reg.map(n=>n.toString().padStart(2,"0")), strong: s.toString() });
    }
    return results;
  }

  /* ─────────────── Ball ─────────────── */
  function Ball({ value, type }) {
    return (
      <div className={`ball ${type==="strong"?"ball-strong":"ball-normal"}`}>
        {String(value).padStart(2,"0")}
      </div>
    );
  }

  /* ─────────────── TicketEditor ─────────────── */
  function TicketEditor({ index, ticket, onChange, onRemove, total, onScan, scanning }) {
    const fileRef  = useRef();
    const [collapsed, setCollapsed] = useState(false);

    const selectedNums = new Set(ticket.numbers.filter(n=>n!=="").map(n=>parseInt(n)));
    const strongNum    = ticket.strong ? parseInt(ticket.strong) : null;
    const isFull       = selectedNums.size === 6 && strongNum !== null;

    // Auto-collapse once ticket is complete
    useEffect(() => {
      if (isFull) setCollapsed(true);
    }, [isFull]);

    const toggleNum = n => {
      const sel = new Set(selectedNums);
      if (sel.has(n)) { sel.delete(n); }
      else if (sel.size < 6) { sel.add(n); }
      else { return; }
      const nums = [...sel].sort((a,b)=>a-b).map(x=>x.toString().padStart(2,"0"));
      while (nums.length < 6) nums.push("");
      onChange({...ticket, numbers: nums});
    };

    const toggleStrong = n =>
      onChange({...ticket, strong: strongNum===n ? "" : n.toString()});

    // Deselect from collapsed view → also expand
    const deselect = n => {
      toggleNum(n);
      setCollapsed(false);
    };
    const deselectStrong = () => {
      onChange({...ticket, strong: ""});
      setCollapsed(false);
    };

    const handleFile = e => {
      if (e.target.files[0]) onScan(e.target.files[0], index);
      e.target.value = "";
    };

    // ── Collapsed view ──
    if (collapsed) {
      return (
        <div className={`ticket-row ${ticket.double?"double":"normal"}`}
          style={{paddingBottom:10}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
            <div style={{display:"flex", alignItems:"center", gap:6}}>
              <span className="ticket-label">טופס {index+1}</span>
              {ticket.double && (
                <span style={{background:"rgba(255,160,0,0.2)", color:"#ffaa00", fontSize:10,
                  padding:"1px 6px", borderRadius:4, fontWeight:700, border:"1px solid rgba(255,160,0,0.35)"}}>דאבל</span>
              )}
              <span style={{fontSize:10, color:"#50c060"}}>✓ מלא</span>
            </div>
            <div style={{display:"flex", gap:6, alignItems:"center"}}>
              <button onClick={() => setCollapsed(false)} title="ערוך" style={{
                background:"rgba(100,140,255,0.1)", border:"1px solid rgba(100,140,255,0.25)",
                color:"#8aabff", borderRadius:6, padding:"2px 9px", cursor:"pointer",
                fontWeight:700, fontSize:11, fontFamily:"inherit"
              }}>✏️ ערוך</button>
              {total>1 && <button className="remove-btn" onClick={onRemove}>×</button>}
            </div>
          </div>
          {/* Selected balls — click any to deselect + expand */}
          <div style={{display:"flex", gap:5, flexWrap:"wrap", alignItems:"center"}}>
            {[...selectedNums].sort((a,b)=>a-b).map(n => (
              <button key={n} onClick={() => deselect(n)} title="לחץ לביטול"
                style={{
                  width:34, height:34, borderRadius:"50%", border:"none", cursor:"pointer",
                  fontWeight:700, fontSize:11, fontFamily:"monospace", flexShrink:0,
                  background:"linear-gradient(135deg,#4a7fff,#1a40cc)", color:"white",
                  boxShadow:"0 0 8px rgba(74,127,255,0.4)", transition:"transform 0.15s"
                }}
                onMouseEnter={e=>e.currentTarget.style.transform="scale(1.15)"}
                onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}>
                {n.toString().padStart(2,"0")}
              </button>
            ))}
            <div style={{width:1, height:22, background:"rgba(255,255,255,0.1)", margin:"0 2px", flexShrink:0}}/>
            <button onClick={deselectStrong} title="לחץ לביטול"
              style={{
                width:34, height:34, borderRadius:"50%", border:"none", cursor:"pointer",
                fontWeight:700, fontSize:12, fontFamily:"monospace", flexShrink:0,
                background:"linear-gradient(135deg,#d4af37,#f5e27d)", color:"#1a1200",
                boxShadow:"0 0 8px rgba(212,175,55,0.4)", transition:"transform 0.15s"
              }}
              onMouseEnter={e=>e.currentTarget.style.transform="scale(1.15)"}
              onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}>
              {strongNum}
            </button>
          </div>
        </div>
      );
    }

    // ── Expanded (editing) view ──
    return (
      <div className={`ticket-row ${ticket.double?"double":"normal"}`} style={{paddingBottom:14}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
          <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
            <span className="ticket-label">טופס {index+1}</span>
            <span style={{fontSize:11, fontFamily:"monospace",
              color: isFull ? "#50c060" : "#4a5a7a"}}>
              {selectedNums.size}/6{strongNum ? " ★" : ""}
            </span>
            <button className={`double-badge ${ticket.double?"on":"off"}`}
              onClick={() => onChange({...ticket, double: !ticket.double})}>דאבל</button>
            <button className="scan-btn" disabled={scanning}
              onClick={() => fileRef.current.click()}>
              {scanning?"⏳":"📸"} סרוק
            </button>
            <input ref={fileRef} type="file" accept="image/*" capture="camera"
              style={{display:"none"}} onChange={handleFile} />
          </div>
          {total>1 && <button className="remove-btn" onClick={onRemove}>×</button>}
        </div>

        {/* Number grid 1–37 */}
        <div style={{display:"flex", flexWrap:"wrap", gap:4, marginBottom:10}}>
          {Array.from({length:37},(_,i)=>i+1).map(n => {
            const sel      = selectedNums.has(n);
            const disabled = !sel && selectedNums.size >= 6;
            return (
              <button key={n} onClick={() => toggleNum(n)} disabled={disabled}
                style={{
                  width:34, height:34, borderRadius:"50%", border:"none",
                  cursor: disabled ? "not-allowed" : "pointer",
                  fontWeight:700, fontSize:11, fontFamily:"monospace",
                  flexShrink:0, transition:"all 0.15s",
                  background: sel
                    ? "linear-gradient(135deg,#4a7fff,#1a40cc)"
                    : disabled ? "rgba(255,255,255,0.02)" : "rgba(255,255,255,0.06)",
                  color: sel ? "white" : disabled ? "#2a3a5a" : "#4a5a7a",
                  boxShadow: sel ? "0 0 10px rgba(74,127,255,0.5)" : "none",
                  transform: sel ? "scale(1.08)" : "scale(1)"
                }}>
                {n.toString().padStart(2,"0")}
              </button>
            );
          })}
        </div>

        {/* Strong grid 1–7 */}
        <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
          <span style={{fontSize:9, color:"#d4af37", fontWeight:600, letterSpacing:1, marginLeft:2}}>חזק:</span>
          {Array.from({length:7},(_,i)=>i+1).map(n => {
            const sel = strongNum===n;
            return (
              <button key={n} onClick={() => toggleStrong(n)}
                style={{
                  width:34, height:34, borderRadius:"50%", border:"none", cursor:"pointer",
                  fontWeight:700, fontSize:12, fontFamily:"monospace",
                  flexShrink:0, transition:"all 0.15s",
                  background: sel ? "linear-gradient(135deg,#d4af37,#f5e27d)" : "rgba(255,255,255,0.06)",
                  color: sel ? "#1a1200" : "#4a5a7a",
                  boxShadow: sel ? "0 0 10px rgba(212,175,55,0.5)" : "none",
                  transform: sel ? "scale(1.08)" : "scale(1)"
                }}>
                {n}
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  /* ─────────────── DrawCard ─────────────── */
  function DrawCard({ draw, tickets }) {
    const winners = tickets.map((t,i) => {
      const matched = t.numbers.filter(n => n && draw.numbers.includes(n));
      const strongMatch = t.strong && t.strong === draw.strong;
      return { index:i, matched, strongMatch, double: t.double };
    }).filter(w => w.matched.length >= 3);

    const label = typeof draw.draw_number === "number"
      ? `הגרלה #${draw.draw_number}`
      : draw.draw_number === "manual" ? "✏️ בדיקה ידנית" : `הגרלה ${draw.draw_number}`;

    return (
      <div className="draw-card">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
          <span style={{color:"#7a8ab0", fontSize:11, fontWeight:600, letterSpacing:1}}>{label}</span>
          {winners.length>0 && <span className="match-badge">{winners.length} התאמות</span>}
        </div>
        <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:10}}>
          {draw.numbers.map((n,i) => <Ball key={i} value={n} type="normal"/>)}
          <Ball value={draw.strong} type="strong"/>
        </div>
        {winners.length===0
          ? <div style={{color:"#4a5a7a", fontSize:12, fontStyle:"italic"}}>אין טפסים עם 3+ מספרים תואמים (המינימום לזכייה).</div>
          : winners.map(w => (
            <div key={w.index} className="match-ticket">
              <div style={{display:"flex", gap:8, alignItems:"center", flexWrap:"wrap", marginBottom:6}}>
                <span style={{color:"#c3d4ff", fontSize:12, fontWeight:600}}>טופס {w.index+1}</span>
                {w.double && (
                  <span style={{background:"rgba(255,160,0,0.2)", color:"#ffaa00", fontSize:10,
                    padding:"1px 7px", borderRadius:4, fontWeight:700, border:"1px solid rgba(255,160,0,0.4)"}}>
                    דאבל
                  </span>
                )}
                <span style={{color:"#a0b4e8", fontSize:12}}>— {w.matched.length} מספרים</span>
                {w.strongMatch && <span style={{color:"#d4af37", fontSize:12, fontWeight:700}}>+ חזק ★</span>}
              </div>
              <div style={{display:"flex", gap:5, flexWrap:"wrap"}}>
                {w.matched.map((n,i) => <Ball key={i} value={n} type="normal"/>)}
                {w.strongMatch && <Ball value={draw.strong} type="strong"/>}
              </div>
            </div>
          ))
        }
      </div>
    );
  }

  /* ─────────────── LiveDraw ─────────────── */
  function LiveDraw({ tickets }) {
    const [drawn,   setDrawn]   = useState([]);   // regular numbers clicked so far
    const [strong,  setStrong]  = useState(null); // strong number clicked
    const [lastHit, setLastHit] = useState(null); // for pop animation trigger

    const valid = tickets.filter(t => t.numbers.every(n=>n!=="") && t.strong!=="");

    const toggleNum = n => {
      setDrawn(p => {
        if (!p.includes(n) && p.length >= 6) return p; // max 6
        const next = p.includes(n) ? p.filter(x=>x!==n) : [...p, n];
        if (!p.includes(n)) setLastHit(n + "-" + Date.now());
        return next;
      });
    };
    const toggleStrong = n => {
      setStrong(p => p===n ? null : n);
      setLastHit("s" + n + "-" + Date.now());
    };
    const reset = () => { setDrawn([]); setStrong(null); setLastHit(null); };

    // Tier per ticket — minimum win requires 3+ regular numbers (strong alone never counts)
    // none(0-2) / medium(3-4) / high(5) / jackpot(6)
    const tier = (count, sMatch) => {
      if (count < 3) return "none"; // 2 regulars + strong is still NOT a win
      if (count===6 && sMatch) return "jackpot";
      if (count>=5) return "high";
      return "medium"; // 3-4 matches
    };

    return (
      <div>
        {/* Header row */}
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16}}>
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            <span className="live-dot"/>
            <span style={{color:"#ff5555", fontSize:12, fontWeight:700, letterSpacing:1}}>בשידור חי</span>
            <span style={{color:"#4a5a7a", fontSize:12}}>
              {drawn.length} מספר{drawn.length!==1?"ים":""} יצא{drawn.length!==1?"ו":""}
              {strong ? " · חזק ✓" : ""}
            </span>
          </div>
          <button onClick={reset} style={{
            background:"rgba(255,80,80,0.1)", border:"1px solid rgba(255,80,80,0.25)",
            color:"#ff7070", padding:"5px 12px", borderRadius:7, cursor:"pointer",
            fontWeight:700, fontSize:11, fontFamily:"inherit"
          }}>↺ אפס</button>
        </div>

        {/* Drawn numbers strip */}
        <div style={{
          minHeight:50, marginBottom:16, padding:"10px 12px", borderRadius:10,
          background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)",
          display:"flex", gap:6, flexWrap:"wrap", alignItems:"center"
        }}>
          {drawn.length===0 && !strong
            ? <span style={{color:"#3a4a6a", fontSize:13, fontStyle:"italic"}}>לחץ על מספר כדי להתחיל…</span>
            : <>
                {[...drawn].sort((a,b)=>a-b).map(n => (
                  <div key={n} className="ball ball-normal" style={{cursor:"pointer"}} onClick={()=>toggleNum(n)}
                    title="לחץ להסרה">
                    {n.toString().padStart(2,"0")}
                  </div>
                ))}
                {strong && (
                  <div className="ball ball-strong" style={{cursor:"pointer"}} onClick={()=>toggleStrong(strong)}
                    title="לחץ להסרה">
                    {strong.toString().padStart(2,"0")}
                  </div>
                )}
              </>
          }
        </div>

        {/* Grid 1-37 */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:10, color:"#7a8ab0", fontWeight:600, letterSpacing:1, marginBottom:8}}>
            מספרים (1–37)
            {drawn.length >= 6 && <span style={{color:"#ff7070", marginRight:8, fontWeight:700}}> · 6/6 נבחרו</span>}
          </div>
          <div style={{display:"flex", flexWrap:"wrap", gap:5}}>
            {Array.from({length:37},(_,i)=>i+1).map(n => {
              const sel      = drawn.includes(n);
              const disabled = !sel && drawn.length >= 6;
              return (
                <button key={n}
                  className={`num-ball-grid ${sel?"on":"off"}`}
                  disabled={disabled}
                  onClick={()=>toggleNum(n)}
                  style={{opacity: disabled ? 0.25 : 1, cursor: disabled ? "not-allowed" : "pointer"}}>
                  {n.toString().padStart(2,"0")}
                </button>
              );
            })}
          </div>
        </div>

        {/* Strong grid 1-7 */}
        <div style={{marginBottom:20}}>
          <div style={{fontSize:10, color:"#d4af37", fontWeight:600, letterSpacing:1, marginBottom:8}}>מספר חזק (1–7)</div>
          <div style={{display:"flex", gap:5}}>
            {Array.from({length:7},(_,i)=>i+1).map(n => (
              <button key={n}
                className={`num-ball-grid ${strong===n?"strong-on":"strong-off"}`}
                onClick={()=>toggleStrong(n)}>
                {n}
              </button>
            ))}
          </div>
        </div>

        {/* Divider */}
        <div style={{height:1, background:"rgba(255,255,255,0.07)", marginBottom:16}}/>

        {/* Tickets */}
        {valid.length===0
          ? <div style={{textAlign:"center", padding:"30px 0", color:"#4a5a7a", fontSize:13}}>
              אין טפסים מלאים — מלא טפסים בטאב "הטפסים שלי"
            </div>
          : valid.map((t, i) => {
              const hits   = t.numbers.filter(n => drawn.includes(parseInt(n)));
              const sMatch = strong!==null && t.strong===strong.toString();
              const count  = hits.length;
              const t_tier = tier(count, sMatch);

              return (
                <div key={i} className={`live-ticket ${t_tier}`}>
                  {/* Ticket header */}
                  <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
                    <div style={{display:"flex", gap:6, alignItems:"center"}}>
                      <span style={{fontSize:12, fontWeight:700,
                        color: t_tier==="jackpot"?"#d4af37": t_tier==="high"?"#c3d4ff": t_tier==="medium"?"#80e090":"#7a8ab0"
                      }}>טופס {i+1}</span>
                      {t.double && <span style={{background:"rgba(255,160,0,0.2)", color:"#ffaa00", fontSize:10,
                        padding:"1px 6px", borderRadius:4, fontWeight:700, border:"1px solid rgba(255,160,0,0.35)"}}>דאבל</span>}
                      {t_tier==="jackpot" && <span style={{color:"#d4af37", fontSize:12}}>🏆 ג'קפוט!</span>}
                      {t_tier==="high"    && <span style={{color:"#c3d4ff", fontSize:11}}>🔥 {count}/6</span>}
                      {t_tier==="medium"  && <span style={{color:"#80e090", fontSize:11}}>{count}/6 — זכייה!</span>}
                      {t_tier==="none"    && <span style={{color:"#5a6a8a", fontSize:11}}>{count}/6 (צריך 3 לזכייה)</span>}
                    </div>
                    {/* Progress dots */}
                    <div style={{display:"flex", gap:3}}>
                      {Array.from({length:6},(_,j) => (
                        <div key={j} style={{
                          width:7, height:7, borderRadius:"50%", transition:"background 0.2s",
                          background: j<count
                            ? (t_tier==="jackpot"?"#d4af37": t_tier==="high"?"#4a7fff":"#50c060")
                            : "rgba(255,255,255,0.1)"
                        }}/>
                      ))}
                    </div>
                  </div>
                  {/* Numbers row */}
                  <div style={{display:"flex", gap:5, flexWrap:"wrap", alignItems:"center"}}>
                    {t.numbers.map((n,j) => {
                      const hit = drawn.includes(parseInt(n));
                      const isLast = lastHit && lastHit.startsWith(parseInt(n)+"-") && hit;
                      return (
                        <div key={j}
                          className={isLast ? "ball-hit" : ""}
                          style={{
                            width:34, height:34, borderRadius:"50%", display:"flex",
                            alignItems:"center", justifyContent:"center", fontWeight:700, fontSize:13,
                            flexShrink:0, transition:"all 0.2s",
                            background: hit
                              ? "linear-gradient(135deg,#4a7fff,#1a40cc)"
                              : "rgba(255,255,255,0.05)",
                            color: hit ? "white" : "#3a4a6a",
                            boxShadow: hit ? "0 0 12px rgba(74,127,255,0.6)" : "none"
                          }}>
                          {n}
                        </div>
                      );
                    })}
                    <div style={{width:1, height:22, background:"rgba(255,255,255,0.1)", margin:"0 2px", flexShrink:0}}/>
                    {/* Strong number */}
                    <div style={{
                      width:34, height:34, borderRadius:"50%", display:"flex",
                      alignItems:"center", justifyContent:"center", fontWeight:700, fontSize:13,
                      flexShrink:0, transition:"all 0.2s",
                      background: sMatch
                        ? "linear-gradient(135deg,#d4af37,#f5e27d)"
                        : "rgba(255,255,255,0.05)",
                      color: sMatch ? "#1a1200" : "#3a4a6a",
                      boxShadow: sMatch ? "0 0 12px rgba(212,175,55,0.6)" : "none"
                    }}>
                      {t.strong}
                    </div>
                  </div>
                </div>
              );
            })
        }
      </div>
    );
  }

  /* ─────────────── App ─────────────── */
  function App() {
    const [tickets,    setTickets]    = useState([makeBlank()]);
    const [tab,        setTab]        = useState("tickets");
    const [checkMode,  setCheckMode]  = useState("manual");  // "manual" | "paste"
    const [manualDraw, setManualDraw] = useState({ numbers:["","","","","",""], strong:"" });
    const [pasteText,  setPasteText]  = useState("");
    const [results,    setResults]    = useState([]);
    const [error,      setError]      = useState("");
    const [saveMsg,    setSaveMsg]    = useState("");
    const [scanning,   setScanning]   = useState(false);
    const [scanMsg,    setScanMsg]    = useState("");

    // Load from localStorage
    useEffect(() => {
      try {
        const saved = localStorage.getItem("lotto_tickets");
        if (saved) {
          const p = JSON.parse(saved);
          if (Array.isArray(p) && p.length>0) setTickets(p);
        }
      } catch(_) {}
    }, []);

    const saveTickets = useCallback(() => {
      try {
        localStorage.setItem("lotto_tickets", JSON.stringify(tickets));
        setSaveMsg("נשמר ✓"); setTimeout(()=>setSaveMsg(""), 2000);
      } catch { setSaveMsg("שגיאה ✗"); }
    }, [tickets]);

    const addTicket    = () => setTickets(t => [...t, makeBlank()]);
    const removeTicket = i  => setTickets(t => t.filter((_,idx) => idx!==i));

    const validTickets = tickets.filter(t => t.numbers.every(n=>n!=="") && t.strong!=="");

    /* ── Manual check ── */
    const checkManual = () => {
      setError("");
      const nums = manualDraw.numbers.map(n => n.toString().padStart(2,"0"));
      if (nums.some(n=>n==="00") || !manualDraw.strong) {
        setError("יש למלא 6 מספרים ומספר חזק."); return;
      }
      setResults([{ draw_number:"manual", numbers:nums, strong:manualDraw.strong }]);
      setTab("results");
    };

    /* ── Paste check ── */
    const checkPaste = () => {
      setError("");
      if (!pasteText.trim()) { setError("יש להדביק תוצאות."); return; }
      const parsed = parsePastedResults(pasteText);
      if (!parsed.length) {
        setError("לא הצלחתי לפרסר את הטקסט. נסה את הפורמט המומלץ."); return;
      }
      setResults(parsed);
      setTab("results");
    };

    /* ── Tesseract scan ── */
    const handleScan = useCallback(async (file, ticketIndex) => {
      setScanning(true);
      setScanMsg("מעבד תמונה…");
      try {
        const worker = await Tesseract.createWorker("eng", 1, {
          logger: m => { if (m.status==="recognizing text") setScanMsg(`סורק… ${Math.round(m.progress*100)}%`); }
        });
        await worker.setParameters({ tessedit_char_whitelist: "0123456789 " });
        const { data: { text } } = await worker.recognize(file);
        await worker.terminate();

        // Extract all 1-2 digit numbers
        const found = (text.match(/\b\d{1,2}\b/g)||[]).map(Number);
        const regular = [...new Set(found.filter(n=>n>=1&&n<=37))].slice(0,6);
        const strong  = found.find(n=>n>=1&&n<=7);

        if (regular.length < 1) {
          setScanMsg("⚠️ לא נמצאו מספרים — נסה תמונה ברורה יותר"); 
          setTimeout(()=>setScanMsg(""),4000);
        } else {
          const nums = [...regular.map(n=>n.toString().padStart(2,"0")), ...Array(6-regular.length).fill("")].slice(0,6);
          setTickets(prev => {
            const next = [...prev];
            next[ticketIndex] = { ...next[ticketIndex], numbers: nums, strong: strong?strong.toString():"" };
            return next;
          });
          setScanMsg(`✓ נמצאו ${regular.length} מספרים — בדוק ותקן אם צריך`);
          setTimeout(()=>setScanMsg(""),4000);
        }
      } catch(e) {
        setScanMsg("שגיאה בסריקה: "+e.message);
        setTimeout(()=>setScanMsg(""),5000);
      }
      setScanning(false);
    }, []);

    /* ─── render ─── */
    const tabDefs = [
      ["tickets","🎟 הטפסים שלי"],
      ["check",  "🔍 בדיקה"],
      ["live",   "🔴 Live"],
      ["results",`🏆 תוצאות${results.length?` (${results.length})`:""}`]
    ];

    return (
      <div style={{minHeight:"100vh", background:"linear-gradient(160deg,#080d1a 0%,#0d1530 60%,#070b15 100%)", direction:"rtl"}}>
        <div style={{maxWidth:740, margin:"0 auto", padding:"0 14px 40px"}}>

          {/* Header */}
          <div style={{textAlign:"center", padding:"32px 0 24px"}}>
            <img src="https://www.pais.co.il/images/Lotto-sml_1.png" alt="לוטו"
              style={{height:80, objectFit:"contain", marginBottom:14, filter:"drop-shadow(0 4px 16px rgba(212,175,55,0.25))"}}/>
            <p style={{color:"#4a5a7a", fontSize:13, marginTop:2}}>שמור טפסים · בדוק תוצאות · סרוק מהטלפון</p>
          </div>

          {/* Tabs */}
          <div style={{display:"flex", gap:6, marginBottom:20, background:"rgba(255,255,255,0.04)", borderRadius:10, padding:4}}>
            {tabDefs.map(([key,label]) => (
              <button key={key} className={`tab-btn${tab===key?" active":""}`} onClick={()=>setTab(key)}>{label}</button>
            ))}
          </div>

          {/* ── TICKETS TAB ── */}
          {tab==="tickets" && (
            <div>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
                <span style={{color:"#7a8ab0", fontSize:12}}>
                  <span style={{fontFamily:"monospace"}}>{validTickets.length}/{tickets.length}</span> טפסים מלאים
                </span>
                <div style={{display:"flex", gap:8}}>
                  <button className="save-btn" onClick={saveTickets}>{saveMsg||"💾 שמור"}</button>
                  <button onClick={addTicket} style={{
                    background:"rgba(100,140,255,0.15)", border:"1px solid rgba(100,140,255,0.35)",
                    color:"#c3d4ff", padding:"7px 14px", borderRadius:8, cursor:"pointer",
                    fontWeight:700, fontSize:12, fontFamily:"inherit"
                  }}>+ הוסף טופס</button>
                </div>
              </div>

              {scanMsg && (
                <div style={{marginBottom:10, padding:"8px 14px", borderRadius:8,
                  background:"rgba(100,200,100,0.08)", border:"1px solid rgba(100,200,100,0.2)",
                  color:"#80d080", fontSize:12}}>{scanMsg}</div>
              )}

              {tickets.map((t,i) => (
                <TicketEditor key={i} index={i} ticket={t} total={tickets.length}
                  scanning={scanning}
                  onScan={handleScan}
                  onRemove={() => removeTicket(i)}
                  onChange={updated => { const next=[...tickets]; next[i]=updated; setTickets(next); }}
                />
              ))}

              <div className="info-box" style={{marginTop:10}}>
                6 מספרים (1–37) · מספר חזק בשדה הזהוב (1–7) · <b>דאבל</b> = סמן טופס כפול ·
                <b> 📸 סרוק</b> = צלם טופס פיזי וה-OCR ינסה לחלץ מספרים
              </div>
            </div>
          )}

          {/* ── CHECK TAB ── */}
          {tab==="check" && (
            <div>
              {/* Mode toggle */}
              <div style={{display:"flex", gap:6, marginBottom:16, background:"rgba(255,255,255,0.03)", borderRadius:8, padding:4}}>
                {[["manual","✏️ הכנסה ידנית"],["paste","📋 הדבק תוצאות"]].map(([key,label]) => (
                  <button key={key} className={`tab-btn${checkMode===key?" active":""}`}
                    onClick={()=>{setCheckMode(key); setError("");}}>
                    {label}
                  </button>
                ))}
              </div>

              {/* Manual mode */}
              {checkMode==="manual" && (
                <div className="panel">
                  <h2 style={{fontSize:15, fontWeight:700, marginBottom:6, color:"#c3d4ff"}}>הכנס מספרים זוכים</h2>
                  <p style={{color:"#4a5a7a", fontSize:12, marginBottom:16}}>הקלד את תוצאות ההגרלה ובדוק מיידית</p>
                  <div style={{marginBottom:8}}>
                    <label style={{display:"block", fontSize:10, color:"#7a8ab0", marginBottom:6, letterSpacing:1, fontWeight:600}}>6 מספרים (1–37)</label>
                    <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center"}}>
                      {manualDraw.numbers.map((n,i) => (
                        <input key={i} className="num-input" type="number" min="1" max="37"
                          value={n} placeholder="--"
                          onChange={e => {
                            const p=parseInt(e.target.value);
                            const val=e.target.value===""?"":isNaN(p)?n:Math.min(37,Math.max(1,p)).toString().padStart(2,"0");
                            const nums=[...manualDraw.numbers]; nums[i]=val;
                            setManualDraw(d=>({...d, numbers:nums}));
                          }}/>
                      ))}
                      <div className="divider"/>
                      <div>
                        <div style={{fontSize:9, color:"#d4af37", marginBottom:3, letterSpacing:1, fontWeight:600}}>חזק ★</div>
                        <input className="strong-input" type="number" min="1" max="7"
                          value={manualDraw.strong} placeholder="★"
                          onChange={e => {
                            const p=parseInt(e.target.value);
                            setManualDraw(d=>({...d, strong: e.target.value===""?"":isNaN(p)?d.strong:Math.min(7,Math.max(1,p)).toString()}));
                          }}/>
                      </div>
                    </div>
                  </div>
                  <button className="check-btn" onClick={checkManual} style={{marginTop:16}}>
                    ✅ בדוק את הטפסים שלי
                  </button>
                  {error && <div className="error-box">{error}</div>}
                  <div className="info-box">ללא חיבור לאינטרנט — הבדיקה מתבצעת מיידית.</div>
                </div>
              )}

              {/* Paste mode */}
              {checkMode==="paste" && (
                <div className="panel">
                  <h2 style={{fontSize:15, fontWeight:700, marginBottom:6, color:"#c3d4ff"}}>הדבק תוצאות מהאתר</h2>
                  <p style={{color:"#4a5a7a", fontSize:12, marginBottom:12}}>
                    העתק את תוצאות ההגרלה מ-pais.co.il והדבק כאן — האתר יפרסר אוטומטית
                  </p>
                  <textarea
                    value={pasteText}
                    onChange={e=>setPasteText(e.target.value)}
                    placeholder={`דוגמאות לפורמטים נתמכים:\n\nפורמט אתר פייס:\nהגרלת הלוטו מספר 3500\nעלו המספרים: 3, 12, 19, 24, 31, 35\nהמספר החזק: 3\n\nפורמט מינימלי (7 מספרים, האחרון = חזק):\n03 12 19 24 31 35 3\n\nעם מספר הגרלה (8 מספרים):\n3500 03 12 19 24 31 35 3`}
                  />
                  <button className="check-btn" onClick={checkPaste} style={{marginTop:12}}>
                    📋 פרסר ובדוק
                  </button>
                  {error && <div className="error-box">{error}</div>}
                  <div className="warn-box">
                    ניתן להדביק מספר הגרלות בו-זמנית — כל הגרלה תיבדק בנפרד מול כל הטפסים שלך.
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ── LIVE TAB ── */}
          {tab==="live" && <LiveDraw tickets={validTickets}/>}

          {/* ── RESULTS TAB ── */}
          {tab==="results" && (
            <div>
              {results.length===0
                ? <div style={{textAlign:"center", padding:"50px 20px", color:"#4a5a7a"}}>
                    <div style={{fontSize:40, marginBottom:12}}>🎱</div>
                    <div style={{fontSize:15, fontWeight:600, color:"#7a8ab0", marginBottom:6}}>אין תוצאות עדיין</div>
                    <div style={{fontSize:12}}>עבור לטאב בדיקה כדי להתחיל</div>
                  </div>
                : <>
                    <div style={{color:"#7a8ab0", fontSize:12, marginBottom:14}}>
                      <span style={{fontFamily:"monospace"}}>{results.length}</span> הגרלות ·
                      בודק מול <span style={{fontFamily:"monospace"}}>{validTickets.length}</span> טפסים מלאים
                    </div>
                    {[...results].sort((a,b) => {
                      const na = typeof a.draw_number==="number"?a.draw_number:0;
                      const nb = typeof b.draw_number==="number"?b.draw_number:0;
                      return nb - na;
                    }).map((draw,i) => (
                      <DrawCard key={i} draw={draw} tickets={validTickets}/>
                    ))}
                  </>
              }
            </div>
          )}

        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
