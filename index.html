<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎱 Lotto Checker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080d1a; font-family: 'Segoe UI', sans-serif; color: #e8eeff; direction: rtl; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(100,140,255,0.3); border-radius: 2px; }

    .tab-btn { flex: 1; padding: 9px 0; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; font-size: 12px; transition: all 0.2s; font-family: inherit; background: transparent; color: #4a5a7a; }
    .tab-btn.active { background: rgba(100,140,255,0.18); color: #c3d4ff; box-shadow: 0 0 0 1px rgba(100,140,255,0.3); }

    .num-input { width: 40px; height: 36px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: 700; outline: none; font-family: monospace; border: 1px solid rgba(100,140,255,0.3); background: rgba(100,140,255,0.08); color: #c3d4ff; }
    .strong-input { width: 40px; height: 36px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: 700; outline: none; font-family: monospace; border: 1px solid rgba(212,175,55,0.4); background: rgba(212,175,55,0.08); color: #d4af37; }
    
    .paste-area { width: 100%; height: 120px; border-radius: 9px; border: 1px solid rgba(100,140,255,0.3); background: rgba(100,140,255,0.05); color: #c3d4ff; padding: 12px; font-size: 13px; outline: none; font-family: inherit; resize: none; text-align: right; }

    .check-btn { height: 42px; padding: 0 24px; border-radius: 9px; border: none; font-weight: 700; font-size: 13px; font-family: inherit; transition: all 0.2s; width: 100%; margin-top: 12px; }
    .check-btn:enabled { cursor: pointer; background: linear-gradient(135deg, #4a7fff, #2a50cc); color: white; box-shadow: 0 4px 16px rgba(74,127,255,0.3); }
    
    .link-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.3); background: rgba(212,175,55,0.08); color: #d4af37; font-weight: 700; font-size: 12px; text-decoration: none; transition: all 0.2s; margin-bottom: 14px; }
    .link-btn:hover { background: rgba(212,175,55,0.15); box-shadow: 0 0 12px rgba(212,175,55,0.1); }

    .save-btn { background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.4); color: #d4af37; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; font-family: inherit; }

    .ball { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .ball-normal { background: linear-gradient(135deg, #e8f0ff, #c3d4ff); color: #0d1a4a; box-shadow: 0 2px 8px rgba(100,140,255,0.3); }
    .ball-strong { background: linear-gradient(135deg, #d4af37, #f5e27d); color: #1a1200; box-shadow: 0 2px 8px rgba(212,175,55,0.5); }

    .ticket-row { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; margin-bottom: 7px; }
    .ticket-label { font-size: 10px; color: #7a8ab0; margin-bottom: 7px; font-weight: 600; letter-spacing: 1px; }
    .ticket-inputs { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; direction: ltr; justify-content: flex-end; }
    .divider { width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 2px; }

    .draw-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; text-align: right; }
    .draw-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .draw-num { color: #7a8ab0; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
    .match-badge { background: rgba(212,175,55,0.15); color: #d4af37; font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: 700; border: 1px solid rgba(212,175,55,0.3); }
    .match-ticket { margin-top: 8px; background: rgba(100,140,255,0.05); border-radius: 8px; padding: 8px 12px; border: 1px solid rgba(100,140,255,0.15); }

    .info-box { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: rgba(100,140,255,0.05); border: 1px solid rgba(100,140,255,0.1); font-size: 11px; color: #7a8ab0; text-align: right; }
    .warn-box { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: rgba(212,175,55,0.05); border: 1px solid rgba(212,175,55,0.12); font-size: 11px; color: #a68042; text-align: right; }
    .error-box { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: rgba(255,80,80,0.07); border: 1px solid rgba(255,80,80,0.2); color: #ff8080; font-size: 13px; text-align: right; }

    .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 22px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    function makeBlank() {
      return { numbers: ["","","","","",""], strong: "" };
    }

    function Ball({ value, type }) {
      return (
        <div className={`ball ${type === "strong" ? "ball-strong" : "ball-normal"}`}>
          {String(value).padStart(2,"0")}
        </div>
      );
    }

    function TicketEditor({ index, ticket, onChange, onRemove, total }) {
      const handleNum = (i, val) => {
        const nums = [...ticket.numbers];
        const p = parseInt(val);
        nums[i] = val === "" ? "" : isNaN(p) ? nums[i] : Math.min(37, Math.max(1, p)).toString().padStart(2,"0");
        onChange({ ...ticket, numbers: nums });
      };
      const handleStrong = (val) => {
        const p = parseInt(val);
        onChange({ ...ticket, strong: val === "" ? "" : isNaN(p) ? ticket.strong : Math.min(7, Math.max(1, p)).toString() });
      };
      return (
        <div className="ticket-row">
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:7}}>
            <div className="ticket-label" style={{marginBottom:0}}>טופס {index + 1}</div>
            {total > 1 && (
              <button onClick={onRemove} title="Remove ticket" style={{
                background:"rgba(255,80,80,0.1)", border:"1px solid rgba(255,80,80,0.25)",
                color:"#ff7070", borderRadius:6, width:22, height:22, cursor:"pointer",
                fontSize:13, lineHeight:1, display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"inherit"
              }}>×</button>
            )}
          </div>
          <div className="ticket-inputs">
            {ticket.numbers.map((n, i) => (
              <input key={i} className="num-input" type="number" min="1" max="37"
                value={n} placeholder="--" onChange={e => handleNum(i, e.target.value)} />
            ))}
            <div className="divider" />
            <input className="strong-input" type="number" min="1" max="7"
              value={ticket.strong} placeholder="★" onChange={e => handleStrong(e.target.value)} />
          </div>
        </div>
      );
    }

    function DrawCard({ draw, tickets }) {
      const winners = tickets.map((t, i) => {
        const matched = t.numbers.filter(n => n && draw.numbers.includes(n));
        const strongMatch = t.strong && t.strong === draw.strong;
        return { index: i, matched, strongMatch };
      }).filter(w => w.matched.length >= 2);

      return (
        <div className="draw-card">
          <div className="draw-header">
            <span className="draw-num">הגרלה מספר #{draw.draw_number}</span>
            {winners.length > 0 && (
              <span className="match-badge">{winners.length} התאמות</span>
            )}
          </div>
          <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:10, direction:"ltr", justifyContent:"flex-end"}}>
            {draw.numbers.map((n,i) => <Ball key={i} value={n} type="normal" />)}
            <Ball value={draw.strong} type="strong" />
          </div>
          {winners.length === 0
            ? <div style={{color:"#4a5a7a", fontSize:12, fontStyle:"italic"}}>אין טפסים תואמים (נדרש לפחות 2 מספרים).</div>
            : winners.map(w => (
              <div key={w.index} className="match-ticket">
                <div style={{display:"flex", gap:8, alignItems:"center", flexWrap:"wrap", marginBottom:6}}>
                  <span style={{color:"#c3d4ff", fontSize:12, fontWeight:600}}>טופס {w.index + 1}:</span>
                  <span style={{color:"#a0b4e8", fontSize:12}}>נמצאו {w.matched.length} מספרים תואמים</span>
                  {w.strongMatch && <span style={{color:"#d4af37", fontSize:12, fontWeight:700}}>+ מספר חזק ★</span>}
                </div>
                <div style={{display:"flex", gap:5, flexWrap:"wrap", direction:"ltr", justifyContent:"flex-end"}}>
                  {w.matched.map((n,i) => <Ball key={i} value={n} type="normal" />)}
                  {w.strongMatch && <Ball value={draw.strong} type="strong" />}
                </div>
              </div>
            ))
          }
        </div>
      );
    }

    function App() {
      const [tickets, setTickets] = useState(() => [makeBlank()]);
      const [rawText, setRawText] = useState("");
      const [results, setResults] = useState([]);
      const [error, setError] = useState("");
      const [tab, setTab] = useState("tickets");
      const [saveMsg, setSaveMsg] = useState("");

      useEffect(() => {
        try {
          const saved = localStorage.getItem("lotto_tickets");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) setTickets(parsed);
          }
        } catch(_) {}
      }, []);

      const saveTickets = useCallback(() => {
        try {
          localStorage.setItem("lotto_tickets", JSON.stringify(tickets));
          setSaveMsg("נשמר ✓");
          setTimeout(() => setSaveMsg(""), 2000);
        } catch { setSaveMsg("נכשל ✗"); }
      }, [tickets]);

      const processText = () => {
        if (!rawText.trim()) { setError("אנא הכנס טקסט עם תוצאות הגרלה."); return; }
        setError("");

        try {
          const regex = /בהגרלה מספר:\s*(\d+).*?עלו המספרים:\s*([\d\s,]+)\s*המספר החזק:\s*(\d+)/g;
          const parsedDraws = [];
          let match;

          while ((match = regex.exec(rawText)) !== null) {
            const drawNum = parseInt(match[1]);
            const numbersStr = match[2];
            const strongStr = match[3].trim();

            const numbers = numbersStr.split(",")
              .map(n => n.trim().padStart(2, "0"))
              .filter(n => n.length > 0);

            if (numbers.length === 6) {
              parsedDraws.push({
                draw_number: drawNum,
                numbers: numbers,
                strong: strongStr
              });
            }
          }

          if (parsedDraws.length === 0) {
            throw new Error("לא הצלחנו למצוא נתוני הגרלה בפורמט התקין. ודא שהעתקת את שורת 'בהגרלה מספר...' במלואה.");
          }

          setResults(parsedDraws);
          setTab("results");
        } catch(e) {
          setError(e.message);
        }
      };

      const addTicket = () => setTickets(t => [...t, makeBlank()]);
      const removeTicket = (i) => setTickets(t => t.filter((_, idx) => idx !== i));

      const validTickets = tickets.filter(t => t.numbers.every(n => n !== "") && t.strong !== "");

      return (
        <div style={{minHeight:"100vh", background:"linear-gradient(160deg,#080d1a 0%,#0d1530 60%,#070b15 100%)"}}>
          <div style={{maxWidth:740, margin:"0 auto", padding:"0 14px 40px"}}>

            {/* Header */}
            <div style={{textAlign:"center", padding:"32px 0 24px"}}>
              <img
                src="https://www.pais.co.il/images/Lotto-sml_1.png"
                alt="Lotto Logo"
                style={{height:80, objectFit:"contain", marginBottom:14, filter:"drop-shadow(0 4px 16px rgba(212,175,55,0.25))"}}
              />
              <p style={{color:"#4a5a7a", fontSize:13, marginTop:2}}>שמירת טפסים קבועים · העתקה קלה ללא עלות</p>
            </div>

            {/* Tabs */}
            <div style={{display:"flex", gap:6, marginBottom:20, background:"rgba(255,255,255,0.04)", borderRadius:10, padding:4}}>
              {[["tickets","🎟 הטפסים שלי"],["check","🔍 הדבקת הגרלות"],["results",`🏆 תוצאות הבדיקה${results.length ? ` (${results.length})` : ""}`]].map(([key,label]) => (
                <button key={key} className={`tab-btn${tab===key?" active":""}`} onClick={() => setTab(key)}>{label}</button>
              ))}
            </div>

            {/* TICKETS */}
            {tab === "tickets" && (
              <div>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
                  <span style={{color:"#7a8ab0", fontSize:12}}>
                    <span>{validTickets.length}/{tickets.length}</span> טפסים מלאים
                  </span>
                  <div style={{display:"flex", gap:8}}>
                    <button className="save-btn" onClick={saveTickets}>{saveMsg || "💾 שמור טפסים"}</button>
                    <button onClick={addTicket} style={{
                      background:"rgba(100,140,255,0.15)", border:"1px solid rgba(100,140,255,0.35)",
                      color:"#c3d4ff", padding:"7px 14px", borderRadius:8, cursor:"pointer",
                      fontWeight:700, fontSize:12, fontFamily:"inherit"
                    }}>+ הוסף טופס</button>
                  </div>
                </div>
                {tickets.map((t, i) => (
                  <TicketEditor key={i} index={i} ticket={t} total={tickets.length}
                    onRemove={() => removeTicket(i)}
                    onChange={updated => {
                      const next = [...tickets]; next[i] = updated; setTickets(next);
                    }} />
                ))}
                <div className="info-box">
                  הזן 6 מספרים (1–37) לכל טור · מספר חזק בזהב (1–7) · הנתונים נשמרים בדפדפן שלך.
                </div>
              </div>
            )}

            {/* CHECK */}
            {tab === "check" && (
              <div className="panel">
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", marginBottom:10}}>
                  <h2 style={{fontSize:16, fontWeight:700, color:"#c3d4ff"}}>הדבק את תוצאות ההגרלה</h2>
                  
                  {/* כפתור הקישור החדש לאתר התוצאות */}
                  <a href="https://paisresults.co.il" target="_blank" rel="noopener noreferrer" className="link-btn">
                    🌐 פתח את אתר התוצאות לקבלת נתונים
                  </a>
                </div>
                
                <p style={{fontSize:12, color:"#7a8ab0", marginBottom:12, textAlign:"right"}}>לחץ על הכפתור למעלה, העתק את שורות ההגרלה הרלוונטיות והדבק אותן כאן:</p>
                
                <textarea 
                  className="paste-area" 
                  placeholder="לדוגמה:&#10;בהגרלה מספר: 3928 מתאריך: 24/05/2026 עלו המספרים: 02 , 05 , 06 , 08 , 30 , 37 המספר החזק: 6 ."
                  value={rawText}
                  onChange={e => setRawText(e.target.value)}
                />

                <button className="check-btn" onClick={processText}>
                  🔍 בדוק התאמות עכשיו
                </button>
                
                {error && <div className="error-box">{error}</div>}
                
                <div className="warn-box">
                  ℹ️ ניתן להדביק מספר רב של הגרלות בבת אחת (למשל דף שלם שהעתקת). המערכת תסנן ותשלוף אוטומטית רק את הנתונים הנחוצים.
                </div>
              </div>
            )}

            {/* RESULTS */}
            {tab === "results" && (
              <div>
                {results.length === 0
                  ? <div style={{textAlign:"center", padding:"50px 20px", color:"#4a5a7a"}}>
                      <div style={{fontSize:40, marginBottom:12}}>🎱</div>
                      <div style={{fontSize:15, fontWeight:600, color:"#7a8ab0", marginBottom:6}}>אין תוצאות להצגה</div>
                      <div style={{fontSize:12}}>עבור ללשונית "הדבקת הגרלות" והזן נתונים</div>
                    </div>
                  : <>
                      <div style={{color:"#7a8ab0", fontSize:12, marginBottom:14, textAlign:"right"}}>
                        פוענחו <span>{results.length}</span> הגרלות · נבדקות מול <span>{validTickets.length}</span> טפסים מלאים.
                      </div>
                      {[...results].sort((a,b) => b.draw_number - a.draw_number).map(draw => (
                        <DrawCard key={draw.draw_number} draw={draw} tickets={validTickets} />
                      ))}
                    </>
                }
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
